services:
  mongo:
    image: mongo:8.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports: ['127.0.0.1:27017:27017']
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD-SHELL, 'mongosh --quiet --eval "try { rs.status().ok } catch(e) { rs.initiate({_id: ''rs0'', members: [{_id: 0, host: ''mongo:27017''}] }).ok }" | grep 1']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/kmart?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
    init: true
    restart: unless-stopped
  worker:
    build: .
    command: [node, services/api/dist/worker.js]
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/kmart?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
    init: true
    restart: unless-stopped
volumes:
  mongo-data:
  redis-data:
